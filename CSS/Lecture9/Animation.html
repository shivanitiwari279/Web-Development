<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        div{
            background-color:rgb(247, 143, 8);
            height: 200px;
            width: 400px;
            animation-name: Roam;
            animation-duration: 3s;
            animation-iteration-count: 5;
            
        }
        @keyframes Roam {
            0%{
                background-color: rgb(252, 163, 48);
                height: 300px;
                width: 400px;
                border-radius: 30px;
            }
            25%{
                background-color: rgb(248, 185, 102);
                height: 400px;
                width: 400px;
                border-radius: 60px;
            }
            50%{
                background-color: rgb(249, 209, 158);
                height: 500px;
                width: 400px;
                border-radius: 80px;
            }
            75%{
                background-color: rgb(241, 224, 201);
                height: 600px;
                width: 50wv;
                border-radius: 50%;
            }
            100%{
                background-color: rgb(124, 71, 1);
                height: 100vh;
                width: 50vw;
                border-radius: 30px;
            }
        }
    </style>
</head>
<body>
    <h1>Animation</h1>
    <div></div>
</body>
</html>
