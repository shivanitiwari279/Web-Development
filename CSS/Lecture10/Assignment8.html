<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        .Gallery
        {
            height: 100vh;  
            display: grid;
            grid-template-columns: 1fr 1fr 1fr ;
            grid-template-rows: 300px 300px;
            gap: 15px;
        }
        
        .images img
        {
            height: 100%;
            width: 100%;
            background-size: cover;
        }
        #I5{
           grid-row: span 2px;
        }
       
    </style>
</head>
<body>
    <div class="Gallery">
    <div class="images" id="I1"><img src="https://images.unsplash.com/photo-1761839256791-6a93f89fb8b0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8" ></div>
