<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Property</title>
    <style>
        .parent
        {
            height: 1200px;
            border: 2px solid;
            display: grid;
            grid-template-columns: 400px 400px 400px  ;
            grid-template-rows: 300px 300px 300px ;
            gap: 10px;
        }
        .child
        {
            margin: 20px;
            border: 1px solid purple;
        }
        .child img
        {
            height: 100%;
            width: 100%;
            background-size: cover;
        }
        #one
            {
            background-color: rgb(249, 201, 245);
            /* grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 4; */
        }
        #two
        {
            background-color: rgb(192, 218, 235);
            /* grid-row-start: 3;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2; */
        }
        #three
        {
            background-color: rgb(171, 186, 161);
        }
        #four
        {
            background-color: rgb(215, 250, 229);
        }
        #five
        {
            background-color: rgb(250, 215, 232);

        }
        #six    
        {
            background-color: rgb(215, 250, 245);
        }
        #seven
        {
            background-color: rgb(146, 172, 157);
        }
        #eight
        {
            background-color: rgb(250, 215, 218);
        }
        #nine
        {
            background-color: rgb(242, 215, 250);
        }
        #ten
        {
            background-color: antiquewhite;
        }
        #eleven
        {
            background-color: rgb(244, 250, 215);
        }
        #twelve
        {
            background-color: rgb(219, 186, 183);
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child" id="one"><img src="https://images.unsplash.com/photo-1761839256791-6a93f89fb8b0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8"></div>
    <div class="child" id="two">2</div>
    <div class="child" id="three">3</div>
    <div class="child" id="four">4</div>
    <div class="child" id="five">5</div>
    <div class="child" id="six">6</div>
    <div class="child"id="seven">7</div>
    <div class="child" id="eight">8</div>
    <div class="child" id="nine">9</div>
    <div class="child" id="ten">10</div>
    <div class="child" id="eleven">11</div>
    <div class="child" id="twelve">12</div>
    </div>
</body>
</html>
