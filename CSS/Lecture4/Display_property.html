<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPLAY PROPERTY</title>
    <style>
        /* distance b/w content and body of any element called padding
        whereas distance b/w two element called margin */
             div
             {
                text-align: center;
                height: 200px;
                width: 200px;
                background-color: rgb(55, 114, 182);
                display: block;
                /* padding: 60px 60px 40px 40px;             
                margin: 50px 30px; 
                border: 5px solid;                                   */
             }  
              /* In display: none property will not display as well as don't exist
              In visibility: hidden property will not display abut will exist  */
             span
             {
                background-color: rgb(99, 68, 167);
                height: 200px;
                width: 200px;
                /* display: block; */
                display: inline-block;
                /* display: none;    */
               visibility: hidden;            
             }
    </style>
</head>
<body>
    <!--DISPLAY PROPERTY-->
    <div>CSS learing in WEB D</div>
     <span>WEB Development</span>
     <span>Casecading style sheet</span>
     <p>Working Along!</p>
</body>
</html>
