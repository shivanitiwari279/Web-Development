<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Cards</title>
    <style>
           #main{
            height: 400px;
            width: 300px;
            position: absolute;
            display: inline-block;
            margin: 50px auto;
            left: 600px;
            top: 100px;
            transition: 1s;
            border-radius: 21px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
           }
           #card_upper{
            height: 50%;
            width: 100%;
           }
           #card_center{
            height: 45%;
            width: 50%;
           }
           img{
            height: 100%;
            width: 100%;
          
           }
           #card_center img{
            border-radius: 50%;
            position: relative;
            top: -90px;
            left: 80px;
           }
           #main:hover{
            transform: scale(1.2) rotate(360deg);
           }
    </style>
</head>
<body>
    <div id="main">
        <div id="card_upper">
            <img src="https://images.unsplash.com/photo-1522416263954-d5de6077e321?ixlib=rb-0.3.5&ixid=eyJhcHBfaWQiOjEyMDd9&s=0b8a5d13896a337d0a5f09e27121d7c4&fit=crop&w=1000&h=1000&q=80/">
        </div>
        <div id="card_center">

        </div>
    </div>
