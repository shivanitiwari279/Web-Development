<!DOCTYPE html>
<html lang="en">
<head>

        <td>10:00-11:00</td>
        <td>11:00-12:00</td>

    </tr>

        <td>HTML</td>

    <tr>
        <td>Tuesday</td>
        <td>HTML</td>
        <td>CSS</td>
        <td>Revision</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td colspan="2">Labwork</td>
        <td>JavaScript</td>
        <td>Test</td>
    </tr>
    <tr>
        <td>Thursday</td>
        <td>CSS</td>

    </tr>
