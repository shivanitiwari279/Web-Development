<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>  
        <legend><h2>Form</h2></legend>                     <!-- A tag which provide the bos fro creating specific region-->
       <form>
        <label for="100">Name:</label>
        <input type="text" placeholder="Enter your name" id="100">
        <br><br>
        <label for="101">Password:</label>
        <input type="password" placeholder="Enter your password" id="101">
        <br><br>
        <label for="102">Number:</label>
        <input type="number" placeholder="Enter your number" id="102">
        <br><br>
        <label for="103">E-mail:</label>
        <input type="email" placeholder="Enter your e-mail" id="103">
        <br><br>
        <label for="colour">Colour</label>
        <input type="colour" id="colour">
        <br>
        <h3>Select your Gender</h3>
        <label for="105">Female</label>
        <input type="radio" value="Gender" name="Female" id="105">
        <label for="106">Male</label>
        <input type="radio" value="Gender" name="Female" id="106">
        <br>
        <h3>Select State:</h3>
        <select name="State" id="107">
        <option value="Delhi">Delhi</option>
        <option value="Mp"></option>
        <option value="Maharashtra"></option>
        <option value="UP"></option>
        </select>
        <br><br>
        <h3>Select City:</h3>
        <label for="108"></label>
        <input type="checkbox" value="city" city="Jabalpur" id="107">Jabalpur
        <br>
        <label for="109"></label>
        <input type="checkbox" value="city" city="Noida" id="108">Noida
        <br>
        <label for="110"></label>
        <input type="checkbox" value="city" city="Mumbai" id="109">Mumbai
        <br><br>
        <textarea placeholder="feedback" rows="8" cols="50"></textarea>
        <br>
        <input type="submit" value="submit">
       </form>
    </fieldset>
</body>
</html>
