<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2" cellspacing="5" >        <!-- BORDER TAG is usef for set the border around table-->
                                                            <!-- Distance b/w two cells called "cellspacing" and distance b/w 
                                                             inside the box or d/w in one cell called"cellpading"-->
        <tr>
           <th>Time</th>
           <th>Monday</th>
           <th>Tuesday</th>
           <th>Wednesdayday</th>
           <th>Thursday</th>
           <th>Friday</th>
        </tr>
        <tr>
            <td>10:40-12:10</td>
            <td colspan="5">WEB DEVELOPMENT</td>
        </tr>
        <tr>
            <td>12:40-2:30</td>
            <td colspan="5">SQL</td>
    
        </tr>
        <tr>
            <td>2:50-4:30</td>
            <td colspan="5">DSA</td>
        </tr>
    </table>
</body>
</html>
