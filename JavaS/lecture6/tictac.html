<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac</title>
      <style>

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:black;
      margin:0;
      font-family:sans-serif;
    }

    .container{
      text-align:center;
    }

    h1{
      color:white;
    }
    h2{
        color:white;
    }

    .board{
      display:grid;
      grid-template-columns:repeat(3,120px);
      gap:10px;
      margin-top:20px;
    }

    .box{
      width:120px;
      height:120px;
      background:white;
      border:none;
      font-size:40px;
      font-weight:bold;
      cursor:pointer;
      border-radius:10px;
    }
    #reset{
    position: absolute;
    bottom: 50px;
    left: 700px;
    margin-top: 550px;
    padding: 10px 20px;
    font-size: 18px;
   }

  </style>
</head>
<body>
    <div class="container">

    <h1>Tic Tac Toe</h1>

    <div class="board">

      <button class="box"></button>
      <button class="box"></button>
      <button class="box"></button>

      <button class="box"></button>
      <button class="box"></button>
      <button class="box"></button>

      <button class="box"></button>
      <button class="box"></button>
      <button class="box"></button>

    </div>

  </div>
    <h2 id="msg"></h2>

   <button id="reset">Reset Game</button>
    <script src="index.js"></script>
</body>
</html>
